<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sender</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 600px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            padding: 40px;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            margin-bottom: 20px;
        }

        .logo i {
            font-size: 4rem;
            color: #3498db;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 2.5rem;
        }

        .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        #send-mail-form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #emails {
            width: 100%;
            padding: 15px 20px;
            margin: 10px 0 20px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            background: #f8f9fa;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        #emails:focus {
            outline: none;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.2);
        }

        button {
            background: linear-gradient(90deg, #00b09b, #96c93d);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 176, 155, 0.4);
            font-weight: bold;
            width: 100%;
            max-width: 300px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 176, 155, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        .instructions {
            margin-top: 30px;
            padding: 15px;
            background: #e8f4fd;
            border-radius: 15px;
            text-align: left;
        }

        .instructions h3 {
            color: #3498db;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .instructions h3 i {
            margin-right: 10px;
        }

        .instructions ul {
            padding-left: 20px;
            color: #7f8c8d;
        }

        .instructions li {
            margin: 8px 0;
        }

        @media (max-width: 500px) {
            .container {
                padding: 25px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <i class="fas fa-paper-plane"></i>
        </div>
        
        <h1>Email Campaign Manager</h1>
        <p class="subtitle">Send personalized emails to your recipients</p>
        
        <form id="send-mail-form">
            <input type="text" id="emails" placeholder="Enter email addresses (comma separated)" required />
            <button type="submit">
                <i class="fas fa-paper-plane"></i> Send Emails Now
            </button>
        </form>
        
        <div class="instructions">
            <h3><i class="fas fa-info-circle"></i> How to use:</h3>
            <ul>
                <li>Enter email addresses separated by commas</li>
                <li>Example: user1@example.com, user2@domain.com</li>
                <li>Click "Send Emails Now" to start the campaign</li>
                <li>You'll be redirected to the progress tracking page</li>
            </ul>
        </div>
    </div>

    <script>
        // Function to get CSRF token from the cookie
        function getCSRFToken() {
            var csrfToken = null;
            var cookies = document.cookie.split(';');
            cookies.forEach(function(cookie) {
                var parts = cookie.split('=');
                if (parts[0].trim() === 'csrftoken') {
                    csrfToken = parts[1];
                }
            });
            return csrfToken;
        }

        document.getElementById("send-mail-form").onsubmit = function(event) {
            event.preventDefault();
            var emails = document.getElementById("emails").value.split(",")
                .map(email => email.trim())
                .filter(email => email !== "");
            
            // Store emails in session storage for the progress page
            sessionStorage.setItem('emailList', JSON.stringify(emails));
            
            // Get CSRF token from cookies
            var csrfToken = getCSRFToken();

            // Send data to the server to start the email sending task
            fetch('/start-sending-email/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({ emails: emails })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Mail sending started');
                window.location.href = "/count-page/";
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
